# 发布「请我喝杯奶茶」站点
#   → Cloudflare Pages（主站，milktea-6cm.pages.dev）
#   → GitHub Pages（备用）
#
# 触发：推送到 main / 定时同步 / 手动运行
# 同步结果（data/bilibili.json + webp 封面）会提交回仓库，
# 这样某次抓取失败时，页面仍显示上一次的数据。
name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 每小时整点（UTC）同步一次；GitHub 的定时任务经常延迟，甚至漏跑
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # 抓取失败不影响发布：脚本内部已做容错（空间接口失败会自动降级到详情接口）
      - name: 同步作者最新视频
        continue-on-error: true
        run: node tools/fetch-feeds.mjs

      # 把最新数据提交回仓库，作为下一次抓取失败时的兜底
      - name: 保存同步结果
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data videos/bilibili
          if git diff --staged --quiet; then
            echo "同步数据无变化"
          else
            git commit -m "chore: 同步作者最新视频 [skip ci]"
            git push
          fi

      - name: 生成发布目录
        run: |
          node tools/build-site.mjs
          du -sh dist

      # ---------- 主站：Cloudflare Pages ----------
      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy dist --project-name=milktea --branch=main

      # ---------- 备用：GitHub Pages ----------
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4