# 把「请我喝杯奶茶」站点发布到 GitHub Pages
# 触发：推送到 main / 定时同步 / 手动运行
#
# 定时任务会先跑 tools/fetch-feeds.mjs 抓取作者最新作品，
# 结果（data/bilibili.json + 封面图）只进入本次发布的产物，
# 不提交回仓库 —— 这样仓库不会无限增长，也绕开了
# 「GITHUB_TOKEN 推送不会触发其他 workflow」的问题。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每小时整点（UTC）同步一次；GitHub 的定时任务可能延迟几分钟到十几分钟
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 抓取失败不影响发布：脚本内部已做容错，失败时保留旧数据
      - name: 同步作者最新视频
        continue-on-error: true
        run: node tools/fetch-feeds.mjs

      # Pages 已在仓库设置里开启（来源 = GitHub Actions），这里只读取配置
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 复制一份干净副本，排除 .git / .github / _site，避免把仓库历史打进产物
      - name: 准备发布目录
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          echo "--- 发布内容 ---"
          find _site -maxdepth 2 | head -30
          du -sh _site

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4