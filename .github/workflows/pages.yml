# 把「请我喝杯奶茶」站点发布到 GitHub Pages
# 触发：推送到 main / 定时同步 / 手动运行
#
# 同步结果（data/bilibili.json + webp 封面）会提交回仓库，
# 这样某次抓取失败时，页面仍显示上一次的数据，而不是整块消失。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每小时整点（UTC）同步一次；GitHub 的定时任务经常延迟，甚至漏跑
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 抓取失败不影响发布：脚本内部已做容错，失败时保留仓库里上一次的数据
      - name: 同步作者最新视频
        continue-on-error: true
        run: node tools/fetch-feeds.mjs

      # 把最新数据提交回仓库，作为下一次抓取失败时的兜底
      - name: 保存同步结果
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data videos/bilibili
          if git diff --staged --quiet; then
            echo "同步数据无变化"
          else
            git commit -m "chore: 同步作者最新视频 [skip ci]"
            git push
          fi

      # Pages 已在仓库设置里开启（来源 = GitHub Actions），这里只读取配置
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 复制一份干净副本，排除 .git / .github / _site，避免把仓库历史打进产物
      - name: 准备发布目录
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          echo "--- 发布内容 ---"
          find _site -maxdepth 2 | head -30
          du -sh _site

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4