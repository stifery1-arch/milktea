# 把「请我喝杯奶茶」站点发布到 GitHub Pages
# 触发：推送到 main 分支，或手动在 Actions 页面点 Run workflow
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 首次运行会自动开启仓库的 Pages（需要 pages: write 权限）
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 复制一份干净副本，排除 .git / .github，避免把仓库历史打进产物
      - name: 准备发布目录
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          echo "--- 发布内容 ---"
          find _site -maxdepth 2 | head -30
          du -sh _site

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4